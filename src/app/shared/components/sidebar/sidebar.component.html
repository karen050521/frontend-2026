<aside
  [class.translate-x-0]="isOpen()"
  [class.-translate-x-full]="!isOpen()"
  class="fixed left-0 top-16 h-[calc(100vh-4rem)] w-64 theme-nav border-r theme-divider transition-transform duration-300 ease-in-out z-40 flex flex-col"
>
  <nav class="p-4 space-y-2 flex-1 overflow-y-auto">
    @for (item of menuItems(); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="active"
        (click)="closeSidebar()"
        class="theme-nav-item flex items-center gap-3 w-full"
      >
        <!-- Icono -->
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            [attr.d]="item.icon"
          />
        </svg>

        <!-- Label -->
        <span class="flex-1">{{ item.label }}</span>

        <!-- Badge opcional -->
        @if (item.badge) {
          <span class="theme-badge">{{ item.badge }}</span>
        }
      </a>
    }

    <!-- Sección adicional -->
    <div class="pt-4 mt-4 border-t theme-divider">
      <p class="theme-text-tertiary text-xs font-semibold uppercase tracking-wider px-4 mb-2">
        Configuración
      </p>

      <a href="#" class="theme-nav-item flex items-center gap-3 w-full">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
          />
        </svg>
        <span>Ajustes</span>
      </a>
    </div>
  </nav>

  @if (isAuthenticated()) {
    <div class="sidebar-user-footer border-t theme-divider p-3">
      <div class="flex items-center gap-3 px-2 py-2 rounded-lg theme-card">
        <img
          [src]="getAvatarUrl()"
          [alt]="currentUser()?.name || 'Usuario'"
          (error)="onAvatarError($event)"
          class="w-10 h-10 rounded-full object-cover border border-pink-500/60"
        />
        <div class="min-w-0">
          <p class="text-sm font-semibold theme-text-primary truncate">{{ currentUser()?.name }}</p>
          <p class="text-xs theme-text-secondary truncate">{{ currentUser()?.email }}</p>
        </div>
      </div>
    </div>
  }
</aside>

<!-- Overlay para cerrar en móvil -->
@if (isOpen()) {
  <div
    class="fixed inset-0 bg-black bg-opacity-50 z-30 md:hidden fade-in"
    (click)="close.emit()"
  ></div>
}
