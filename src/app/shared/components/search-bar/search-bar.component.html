<div class="flex items-center w-full gap-4">
  <div class="relative w-full max-w-2xl">
    <div class="relative">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <svg class="w-5 h-5 theme-text-tertiary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>

      <input 
        type="text"
        [ngModel]="searchQuery()"
        (ngModelChange)="onSearchChange($event)"
        placeholder="Búsqueda"
        class="theme-input w-full pl-10 pr-10"
        aria-label="Campo de búsqueda"
      />

      @if (searchQuery()) {
        <button 
          (click)="clearSearch()"
          class="absolute inset-y-0 right-0 pr-3 flex items-center theme-icon-button"
          aria-label="Limpiar búsqueda">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
              d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      }
    </div>
  </div>

  <div class="relative flex-shrink-0">
    <button (click)="toggleNotificaciones()" 
      class="relative p-2 theme-text-tertiary hover:text-pink-500 transition-all cursor-pointer outline-none">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
          d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
      </svg>
      
      @if (unreadCount() > 0) {
        <span class="absolute top-1 right-1 bg-pink-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full border-2 border-[#121212]">
          {{ unreadCount() }}
        </span>
      }
    </button>

    @if (showDropdown()) {
      <div class="absolute right-0 mt-3 w-80 bg-[#1e1e1e] border border-gray-800 rounded-2xl shadow-2xl z-50 overflow-hidden">
        <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-pink-500/5">
          <h3 class="font-bold text-sm text-pink-500">Notificaciones</h3>
          <span class="text-[10px] text-gray-500 uppercase tracking-widest">{{ unreadCount() }} pendientes</span>
        </div>

        <div class="max-h-80 overflow-y-auto">
          @for (noti of notificaciones(); track noti.id) {
            <div (click)="marcarLeida(noti)" 
                 [class.bg-pink-500/5]="!noti.leida"
                 class="p-4 border-b border-gray-800/50 hover:bg-white/5 cursor-pointer transition-colors relative">
              @if (!noti.leida) {
                <div class="absolute left-0 top-0 bottom-0 w-1 bg-pink-500"></div>
              }
              <p class="text-sm font-semibold text-gray-200" [class.text-pink-400]="!noti.leida">{{ noti.titulo }}</p>
              <p class="text-xs text-gray-400 mt-1">{{ noti.mensaje }}</p>
              <p class="text-[9px] text-gray-600 mt-2">{{ noti.fechaCreacion | date:'shortTime' }}</p>
            </div>
          } @empty {
            <div class="p-10 text-center">
              <p class="text-gray-500 text-sm">No tienes notificaciones</p>
            </div>
          }
        </div>
      </div>
    }
  </div>
</div>
