<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 p-4 h-[calc(100vh-100px)]">
  
  <div class="lg:col-span-1 flex flex-col gap-4 overflow-y-auto pr-2">
    <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
      📍 Paraderos Cercanos
    </h2>

    <div *ngIf="cargando()" class="text-center p-4 text-gray-500">
      Obteniendo tu ubicación...
    </div>

    <div *ngIf="errorMsg()" class="bg-red-100 text-red-700 p-3 rounded-lg text-sm">
      {{ errorMsg() }}
    </div>

    <div 
      *ngFor="let paradero of paraderos()" 
      (click)="enfocarParadero(paradero)"
      class="bg-white p-4 rounded-xl shadow border border-gray-200 cursor-pointer hover:border-pink-500 hover:shadow-md transition-all">
      
      <h3 class="font-bold text-lg text-gray-900">{{ paradero.nombre }}</h3>
      
      <div class="flex justify-between items-center mt-2 text-sm">
        <span class="text-pink-600 font-semibold">
          🚶‍♂️ {{ paradero.distancia_metros }}m
        </span>
        <span class="text-gray-500">
          ⏱️ ~{{ paradero.duracion_minutos }} min a pie
        </span>
      </div>

      <div class="mt-3">
        <p class="text-xs text-gray-500 font-semibold mb-1">Rutas que pasan por aquí:</p>
        <div class="flex flex-wrap gap-1">
          <span *ngFor="let ruta of paradero.rutas" 
                class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full">
            {{ ruta.nombre }}
          </span>
        </div>
      </div>
    </div>
  </div>

  <div class="lg:col-span-2 relative bg-gray-100 rounded-xl shadow border border-gray-300 overflow-hidden">
    <div #mapaContainer class="w-full h-full min-h-[500px] z-0"></div>
  </div>

</div>
