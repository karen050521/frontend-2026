<div class="min-h-screen flex items-center justify-center px-4 py-12">
  <div class="theme-card w-full max-w-md p-8">
    <div class="text-center mb-8">
      <h2 class="text-2xl font-bold theme-text-primary mb-2">Recuperar Contraseña</h2>
      <p class="theme-text-secondary">Ingresa tu correo para recibir un enlace de recuperación</p>
    </div>

    <!-- Mensaje de éxito -->
    @if (successMessage) {
      <div class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg mb-6">
        {{ successMessage }}
      </div>
    }

    <!-- Mensaje de error -->
    @if (errorMessage) {
      <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-6">
        {{ errorMessage }}
      </div>
    }

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium theme-text-primary mb-2">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="theme-input"
          placeholder="tu@email.com"
          [class.border-red-500]="
            forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched
          "
        />
        @if (forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched) {
          <p class="text-red-500 text-sm mt-1">Email válido es requerido</p>
        }
      </div>

      <!-- Botón de envío -->
      <button
        type="submit"
        class="theme-button w-full"
        [disabled]="forgotForm.invalid || isLoading"
        [class.opacity-50]="forgotForm.invalid || isLoading"
      >
        @if (isLoading) {
          <span>Enviando...</span>
        } @else {
          <span>Enviar Enlace de Recuperación</span>
        }
      </button>

      <!-- Volver al login -->
      <div class="text-center">
        <button
          type="button"
          (click)="goBack()"
          class="text-pink-500 hover:text-pink-600 text-sm font-medium transition-colors"
        >
          Volver al login
        </button>
      </div>
    </form>
  </div>
</div>
