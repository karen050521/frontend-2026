<div class="theme-container min-h-screen">
  <!-- Header fijo en la parte superior -->
  <app-header 
    (menuToggle)="toggleSidebar()"
    (themeToggle)="toggleTheme()"
    (search)="handleSearch($event)">
  </app-header>

  <!-- Sidebar lateral -->
  <app-sidebar 
    [isOpen]="isSidebarOpen()"
    (close)="toggleSidebar()">
  </app-sidebar>

  <!-- Contenido principal -->
  <main 
    [class.md:ml-64]="isSidebarOpen()"
    class="pt-16 transition-all duration-300 ease-in-out min-h-screen">
    
    <!-- Contenedor con padding -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
      <!-- Contenido dinámico de las rutas -->
      <div class="fade-in">
        <router-outlet />
      </div>
    </div>
  </main>
</div>
